name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Django 6.1 requires Python >= 3.12; 3.11 cannot install it.
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies (theme)
        working-directory: chaiheadq/theme
        run: |
          npm ci || npm install

      - name: Install Playwright deps and browsers
        # There are no E2E tests yet (no tests/e2e directory), so
        # downloading ~400MB of browsers on every run is wasted time.
        # Re-enable this together with the E2E suite.
        if: hashFiles('tests/e2e/**') != ''
        run: |
          . .venv/bin/activate
          .venv/bin/python -m playwright install --with-deps

      - name: Run linters
        run: |
          . .venv/bin/activate
          pip install ruff black
          ruff check . || true
          black --check . || true

      - name: Run migrations
        run: . .venv/bin/activate && python chaiheadq/manage.py migrate --noinput

      - name: Run unit & API tests
        run: . .venv/bin/activate && python chaiheadq/manage.py test --verbosity=2

      - name: Run Playwright E2E (if any)
        if: always() && hashFiles('tests/e2e/**') != ''
        run: |
          . .venv/bin/activate
          pytest tests/e2e -q

      - name: Coverage report
        run: |
          . .venv/bin/activate
          pip install coverage codecov
          coverage run -m pytest || true
          if [ -n "${{ secrets.CODECOV_TOKEN }}" ]; then
            codecov --token=${{ secrets.CODECOV_TOKEN }} || true
          else
            echo "CODECOV_TOKEN not set; skipping upload"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: test/chaiheadq:latest
