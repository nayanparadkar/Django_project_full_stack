<div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4">
  {% if tweet.photo %}
  <img src="{{ tweet.photo.url }}" class="w-full h-48 object-cover rounded-md mb-3" alt="Tweet Photo">
  {% endif %}
  <div>
    <h5 class="font-semibold text-lg text-gray-900 dark:text-gray-100">{{ tweet.user.username }}</h5>
    <p class="text-gray-700 dark:text-gray-300 mt-2">{{ tweet.content }}</p>
    {% if request.user == tweet.user %}
    <div class="mt-3 flex gap-2">
      <a href="{% url 'tweet_edit' tweet.id %}" class="px-3 py-1 bg-blue-600 text-white rounded">Edit</a>
      <a href="{% url 'tweet_delete' tweet.id %}" class="px-3 py-1 bg-red-600 text-white rounded">Delete</a>
    </div>
    {% endif %}
  </div>
</div>
